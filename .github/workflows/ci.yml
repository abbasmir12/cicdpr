# GitHub Actions CI/CD workflow for Freebuff's Flask app
# This file lives in .github/workflows/ci.yml at the repo root.

name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    # Allows manual triggering from the GitHub UI

# Set up Python and cache dependencies
jobs:
  # Job: Install dependencies
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Upload pip cache artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-cache
          path: ~/.cache/pip
          retention-days: 7

  # Job: Run tests + linting
  test:
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test app imports
        run: python -c "import app; print('App imports successfully')"

      - name: Install linting tools
        run: pip install flake8 black --quiet

      - name: Run flake8 linting
        run: flake8 app.py --max-line-length=100

      - name: Run app health check
        run: |
          python app.py &
          sleep 3
          curl -s http://localhost:5000/ | grep -q "Hello, Freebuff!"
          echo "Health check passed: app responding correctly"

  # Job: Deploy to Render (manual)
  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy to Render
        run: |
          echo "Deploying to Render..."
          echo "1. Go to your Render Dashboard"
          echo "2. Add a Web Service pointing to this repo"
          echo "3. Set the start command to: python app.py"
          echo "4. Trigger a Deploy manually or set Auto-Deploy on main branch"
          exit 1   # we use `when: manual`, so the job simply indicates what to do
